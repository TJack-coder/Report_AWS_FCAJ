{{ $type := .Get "type" | default "info" }}
<div style="margin:1.5rem 0;padding:1rem 1.15rem;border-left:.3rem solid {{ if eq $type "warning" }}#ff9900{{ else if eq $type "danger" }}#d13212{{ else if eq $type "success" }}#1d8102{{ else }}#0073bb{{ end }};background:rgba(127,127,127,.08);border-radius:.25rem;">
  {{ with .Get "title" }}<strong style="display:block;margin-bottom:.35rem;">{{ . }}</strong>{{ end }}
  <div>{{ .Inner | markdownify }}</div>
</div>
