<a href="{{ (.Get "path") | relURL }}" download style="display:inline-flex;align-items:center;gap:.7rem;margin:.35rem .45rem .35rem 0;padding:.75rem 1rem;border:1px solid rgba(127,127,127,.35);border-radius:.35rem;text-decoration:none;">
  <span aria-hidden="true" style="font-size:1.2rem;">⬇</span>
  <span><strong>{{ .Get "label" }}</strong>{{ with .Get "meta" }}<br><small style="opacity:.72;">{{ . }}</small>{{ end }}</span>
</a>
